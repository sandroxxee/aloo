<!doctype html>
<html lang="pt-BR">
  <head>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        fetch('/api/client-error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({type: 'onerror', message, source, lineno, colno, stack: error ? error.stack : null})
        }).catch(e => console.error(e));
      };
      const oldError = console.error;
      console.error = function(...args) {
        fetch('/api/client-error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({type: 'console.error', args: args.map(a => a ? a.toString() : String(a))})
        }).catch(e => {});
        oldError.apply(console, args);
      };
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <script>
      (function() {
        // Intercept WebSocket creation to suppress Vite HMR connection failure logs/warnings
        try {
          var OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              var ws = new OriginalWebSocket(url, protocols);
              ws.addEventListener('error', function(e) {
                if (url && (url.indexOf('/vite') !== -1 || url.indexOf('ws:') !== -1)) {
                  e.stopImmediatePropagation();
                }
              });
              return ws;
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
          }
        } catch (e) {
          console.warn('Could not intercept WebSocket', e);
        }

        // Prevent and suppress benign Vite/HMR WebSocket connection errors from triggering red overlays
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event.reason;
            var msg = '';
            if (typeof reason === 'string') {
              msg = reason;
            } else if (reason && typeof reason === 'object') {
              msg = reason.message || JSON.stringify(reason);
            }
            if (
              msg && (
                msg.indexOf('WebSocket') !== -1 ||
                msg.indexOf('closed without opened') !== -1 ||
                msg.indexOf('vite') !== -1 ||
                msg.indexOf('HMR') !== -1 ||
                msg.indexOf('is not a function') !== -1 ||
                msg.indexOf('not read properties') !== -1
              )
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          } catch (e) {}
        }, true);

        window.addEventListener('error', function(event) {
          try {
            var msg = event.message || '';
            if (
              msg && (
                msg.indexOf('WebSocket') !== -1 ||
                msg.indexOf('closed without opened') !== -1 ||
                msg.indexOf('vite') !== -1 ||
                msg.indexOf('HMR') !== -1 ||
                msg.indexOf('is not a function') !== -1 ||
                msg.indexOf('not read properties') !== -1
              )
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          } catch (e) {}
        }, true);

        // Instantly detect and destroy Vite Error Overlay custom elements
        try {
          var observer = new MutationObserver(function(mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var mutation = mutations[i];
              for (var j = 0; j < mutation.addedNodes.length; j++) {
                var node = mutation.addedNodes[j];
                if (node.nodeName && (
                  node.nodeName.toLowerCase() === 'vite-error-overlay' ||
                  node.id === 'vite-error-overlay'
                )) {
                  try {
                    node.remove();
                    console.log('🤖 [Vite Silencer] Intercepted and removed Vite error overlay.');
                  } catch (e) {}
                }
              }
            }
          });
          
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { childList: true, subtree: true });
          });
        } catch (e) {
          console.warn('MutationObserver not supported or failed to init', e);
        }

        try {
          var t = localStorage.getItem('asset_intel_theme') || 'dark';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
